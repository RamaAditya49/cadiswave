# CadisWave virtual mix sinks.
#
# Creates three persistent null sinks so applications can route audio
# into per-mix destinations:
#
#   - cadiswave_personal_mix : what you hear (route to your headphones)
#   - cadiswave_chat_mix     : send to voice apps via Monitor of CadisWave Chat Mix
#   - cadiswave_record_mix   : send to OBS via Monitor of CadisWave Record Mix
#
context.objects = [
    {   factory = adapter
        args = {
            factory.name      = support.null-audio-sink
            node.name         = cadiswave_personal_mix
            media.name        = cadiswave_personal_mix
            node.description  = "CadisWave Personal Mix"
            media.class       = Audio/Sink
            audio.position    = [ FL FR ]
            object.linger     = true
            monitor.channel-volumes = true
            state.restore-props = false
            priority.session  = 0
        }
    }
    {   factory = adapter
        args = {
            factory.name      = support.null-audio-sink
            node.name         = cadiswave_chat_mix
            media.name        = cadiswave_chat_mix
            node.description  = "CadisWave Chat Mix"
            media.class       = Audio/Sink
            audio.position    = [ FL FR ]
            object.linger     = true
            monitor.channel-volumes = true
            state.restore-props = false
            priority.session  = 0
        }
    }
    {   factory = adapter
        args = {
            factory.name      = support.null-audio-sink
            node.name         = cadiswave_record_mix
            media.name        = cadiswave_record_mix
            node.description  = "CadisWave Record Mix"
            media.class       = Audio/Sink
            audio.position    = [ FL FR ]
            object.linger     = true
            monitor.channel-volumes = true
            state.restore-props = false
            priority.session  = 0
        }
    }
]
